name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fetch full history so we can push repo.json back to main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download Dalamud
        run: |
          mkdir -p $HOME/.xlcore/dalamud/Hooks/dev
          DALAMUD_URL=$(curl -s https://api.github.com/repos/PlusoneChiang/Dalamud/releases/latest \
            | jq -r '.assets[0].browser_download_url')
          echo "Downloading Dalamud from: $DALAMUD_URL"
          wget "$DALAMUD_URL" -O /tmp/dalamud.zip
          unzip -o /tmp/dalamud.zip -d $HOME/.xlcore/dalamud/Hooks/dev

      - name: Extract version from tag
        id: version
        run: |
          # tag = v1.0.0.0 → version = 1.0.0.0
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          # DalamudPackager uses 3-component version (drops 4th component)
          SHORT=$(echo "$VERSION" | cut -d. -f1-3)
          echo "short=$SHORT" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Crossingway.sln

      - name: Build Release
        run: dotnet build -c Release -p:Platform=x64 Crossingway.sln

      - name: Locate and rename zip
        id: zip
        run: |
          # DalamudPackager outputs to out/Crossingway_v{3-ver}/Crossingway/latest.zip
          SRC=$(find out -path "*/Crossingway_v*/Crossingway/latest.zip" | sort | tail -1)
          echo "Found: $SRC"
          cp "$SRC" out/Crossingway.zip
          echo "path=out/Crossingway.zip" >> $GITHUB_OUTPUT

      - name: Update repo.json
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Crossingway.zip"
          jq \
            --arg v "$VERSION" \
            --arg url "$URL" \
            '.[0].AssemblyVersion = $v |
             .[0].TestingAssemblyVersion = $v |
             .[0].DownloadLinkInstall = $url |
             .[0].DownloadLinkTesting = $url |
             .[0].DownloadLinkUpdate = $url' \
            repo.json > repo.json.tmp && mv repo.json.tmp repo.json

      - name: Commit updated repo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git diff --cached --quiet && echo "repo.json unchanged" && exit 0
          git commit -m "chore: update repo.json for ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true
