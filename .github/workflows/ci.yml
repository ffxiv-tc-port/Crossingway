name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download Dalamud
        run: |
          mkdir -p $HOME/.xlcore/dalamud/Hooks/dev
          DALAMUD_URL=$(curl -s https://api.github.com/repos/PlusoneChiang/Dalamud/releases/latest \
            | jq -r '.assets[0].browser_download_url')
          echo "Downloading Dalamud from: $DALAMUD_URL"
          wget "$DALAMUD_URL" -O /tmp/dalamud.zip
          unzip -o /tmp/dalamud.zip -d $HOME/.xlcore/dalamud/Hooks/dev

      - name: Restore
        run: dotnet restore Crossingway.sln

      - name: Build
        run: dotnet build -c Release -p:Platform=x64 Crossingway.sln

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crossingway-dev
          path: out/Crossingway_v*.zip
          if-no-files-found: warn
