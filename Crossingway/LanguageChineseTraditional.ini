Crossingway Settings==Crossingway 設定
General==一般
- Overlays -==- 疊加層 -
Select an overlay on the left to edit its settings.==請在左側選擇一個疊加層以編輯其設定。
Command Help==指令說明
Open this configuration window.==開啟這個設定視窗。
Change a setting for an overlay.==變更某個疊加層的設定。
overlayCommandName: The overlay to edit. Use the 'Command Name' shown in its config.==overlayCommandName：要編輯的疊加層。請使用其設定頁面上顯示的「指令名稱」。
setting: Value to change. Accepted settings are:==setting：要變更的項目。可用的項目如下：
value: Value to set for the setting. Accepted values are:==value：要設定的值。可用的值如下：
string: any string value==string：任意字串
boolean: on, off, toggle==boolean：on、off、toggle
Name==名稱
Command Name==指令名稱
Zoom==縮放
Opacity==透明度
Framerate==影格率
Disabled==停用
Disables the overlay. Contrary to just hiding it this setting will stop it from ever being created.==停用這個疊加層。與單純隱藏不同,這個設定會讓它完全不會被建立。
Muted==靜音
Enables or disables audio playback.==開啟或關閉音效播放。
ACT/IINACT optimizations==ACT/IINACT 最佳化
Enables ACT/IINACT specific optimizations. This will automatically disable the overlay if ACT/IINACT is not running.\n\nNOTE: This does NOT disable the overlay if the websocket is not reporting data.==啟用 ACT/IINACT 專用的最佳化。若 ACT/IINACT 未執行,這個疊加層會自動停用。\n\n注意:即使 WebSocket 沒有回傳資料,這個設定也不會停用疊加層。
Locked==鎖定
Prevent the overlay from being resized or moved. This is implicitly set by Click Through and Fullscreen.==禁止調整這個疊加層的大小或位置。開啟「滑鼠穿透」或「全螢幕」時會自動生效。
Hidden==隱藏
Hide the overlay. This does not stop the overlay from executing, only from being displayed.==隱藏這個疊加層。它仍會繼續運作,只是不顯示出來。
Type Through==鍵盤穿透
Prevent the overlay from intercepting any keyboard events. Implicitly set by Click Through.==讓這個疊加層不再攔截任何鍵盤事件。開啟「滑鼠穿透」時會自動生效。
Click Through==滑鼠穿透
Prevent the overlay from intercepting any mouse events. Implicitly sets Locked and Type Through.==讓這個疊加層不再攔截任何滑鼠事件。會同時自動開啟「鎖定」與「鍵盤穿透」。
Hide out of combat==非戰鬥時隱藏
Hide this overlay when out-of-combat.==非戰鬥狀態時隱藏這個疊加層。
Hide in PvP==PvP 中隱藏
Hide this overlay when in a PvP area.==位於 PvP 區域時隱藏這個疊加層。
Hide Delay==隱藏延遲
Delay to hide overlay when out-of-combat in seconds.==脫離戰鬥後延遲多少秒才隱藏疊加層。
Experimental / Unsupported==實驗性 / 不提供支援
Fullscreen==全螢幕
Automatically makes this overlay cover the entire screen when enabled.==啟用後這個疊加層會自動覆蓋整個畫面。
Custom CSS code:==自訂 CSS 程式碼:
Custom CSS code==自訂 CSS 程式碼
Reload==重新載入
Open Dev Tools==開啟開發者工具
Invalid overlay command. Supported syntax: '[overlayCommandName] [setting] [value]'==疊加層指令格式錯誤。正確格式為:'[overlayCommandName] [setting] [value]'
Unknown overlay '??'.==找不到名為「??」的疊加層。
Unknown setting '??. Valid settings are: url,hidden,locked,fullscreen,clickthrough,typethrough,muted,disabled,act.==未知的設定項目「??」。可用的項目為:url,hidden,locked,fullscreen,clickthrough,typethrough,muted,disabled,act。
Unknown boolean value '??. Valid values are: on,off,toggle.==未知的布林值「??」。可用的值為:on,off,toggle。
Control Crossingway from the chat line! Type '/cw config' or open the settings for more info.==直接從聊天列操作 Crossingway!輸入「/cw config」或開啟設定視窗以了解更多。
No subcommand specified. Valid subcommands are: config,overlay.==未指定子指令。可用的子指令為:config,overlay。
Unknown subcommand '??'. Valid subcommands are: config,overlay,inlay.==未知的子指令「??」。可用的子指令為:config,overlay,inlay。
Crossingway dependencies==Crossingway 相依套件
Crossingway requires additional dependencies to function.\nThese are not shipped with the plugin due to their size.\n\nThe files are hosted on GitHub and are verified with SHA256 checksums:\n==Crossingway 需要額外的相依套件才能運作。\n由於檔案體積過大,並未隨插件一起發佈。\n\n這些檔案存放於 GitHub,並會以 SHA256 checksum 驗證:\n
Install missing dependencies==安裝缺少的相依套件
Installing dependencies: ==正在安裝相依套件:
